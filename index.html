<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prestige Store</title>
<style>
:root{--tx:#eef3ff;--mu:#9fb0d6;--ac:#3b82f6;--ac2:#60a5fa;--card:rgba(255,255,255,.06);--bd:rgba(120,160,255,.22);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#05070f}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4;background:linear-gradient(165deg,#03050c 0%,#071633 45%,#0b2a6b 100%) fixed}
header{max-width:900px;margin:auto;padding:26px 16px 6px;text-align:center}
.logo{font-size:.72rem;letter-spacing:.35em;color:var(--ac2);text-transform:uppercase}
h1{margin:4px 0 0;font-size:2rem;letter-spacing:.04em;background:linear-gradient(90deg,#fff,#7db2ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mu);font-size:.88rem;margin-top:6px}
.wrap{max-width:900px;margin:auto;padding:0 16px 130px}
input,textarea{width:100%;padding:12px 14px;border:1px solid var(--bd);border-radius:12px;background:rgba(255,255,255,.07);color:var(--tx);font:inherit;margin-top:8px}
input::placeholder,textarea::placeholder{color:var(--mu)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0}
.chip{flex:none;padding:8px 16px;border:1px solid var(--bd);border-radius:22px;background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.chip.on{background:linear-gradient(90deg,#2563eb,#3b82f6);border-color:transparent;color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
.p{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;backdrop-filter:blur(6px)}
.ph{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:3.6rem;background:linear-gradient(135deg,#0c1d44,#14377f)}
.ph img{width:100%;height:100%;object-fit:cover}
.pb{padding:11px;display:flex;flex-direction:column;gap:3px;flex:1}
.pn{font-weight:600;font-size:.95rem}
.pp{color:var(--ac2);font-weight:700;font-size:1.1rem}
.dl{color:var(--mu);font-size:.78rem}
select.sel{width:100%;padding:9px;margin-top:6px;border:1px solid var(--bd);border-radius:10px;background:rgba(255,255,255,.08);color:var(--tx);font:inherit;font-size:.9rem}select option{background:#0b1b44;color:#fff}
.btn{border:0;border-radius:12px;padding:11px 12px;background:linear-gradient(90deg,#2563eb,#3b82f6);color:#fff;font:inherit;font-weight:600;cursor:pointer;margin-top:8px}
.btn.sec{background:rgba(255,255,255,.1)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(5,10,25,.88);backdrop-filter:blur(10px);border-top:1px solid var(--bd);display:flex;justify-content:center}
.bar .btn{width:100%;max-width:420px;margin:0}
.wa{position:fixed;right:14px;bottom:calc(80px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;font-size:1.6rem;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.sheet{background:linear-gradient(170deg,#06102a,#0b2158);border:1px solid var(--bd);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd)}
.q button{width:32px;height:32px;border-radius:9px;border:1px solid var(--bd);background:rgba(255,255,255,.08);color:var(--tx);font-size:1rem}
.sum{padding:10px 0;display:grid;gap:4px}
.sum div{display:flex;justify-content:space-between}
.sum .t{font-weight:700;font-size:1.1rem;color:var(--ac2)}
.note{color:var(--mu);font-size:.82rem}
.empty{color:var(--mu);text-align:center;padding:30px 0}
</style>
</head>
<body>
<header>
  <div class="logo">Boutique en ligne</div>
  <h1>Prestige Store</h1>
  <div class="sub">Montres · Maillots · Accessoires · Paiement à la livraison</div>
</header>
<div class="wrap">
  <input id="q" type="search" placeholder="Rechercher un article…">
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>Aucun article trouvé.</div>
</div>

<a class="wa" id="wa" href="#" aria-label="WhatsApp">💬</a>
<div class="bar"><button class="btn" id="open">🛒 Mon panier (<span id="cnt">0</span>)</button></div>

<div class="modal" id="m"><div class="sheet">
  <h2 style="margin:0 0 8px">Mon panier</h2>
  <div id="items"></div>
  <div class="sum" id="sum"></div>
  <div id="form">
    <input id="nom" placeholder="Votre nom">
    <input id="tel" type="tel" placeholder="Votre numéro de téléphone">
    <textarea id="adr" rows="2" placeholder="Adresse de livraison (commune, quartier, avenue…)"></textarea>
    <p class="note">Vous payez à la livraison. Votre commande est envoyée sur WhatsApp pour confirmation.</p>
    <button class="btn" id="send" style="width:100%">Envoyer ma commande sur WhatsApp</button>
  </div>
  <button class="btn sec" id="close" style="width:100%">Continuer mes achats</button>
</div></div>

var SIZES = {shoe:["35","36","37","40"], cloth:["S","M","L","XL","XXL"]}; // pointures et tailles
PRODUCTS.forEach(function(p){if(p.cat==="Chaussures")p.sizes=SIZES.shoe;else if([2,3,14,17].indexOf(p.id)>-1)p.sizes=SIZES.cloth});
var cart = {}, cat = "Tous";
function $(i){return document.getElementById(i)}
function usd(n){return n+" $"}
function fc(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g," ")+" FC"}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
$("wa").href = "https://wa.me/" + WHATSAPP;
function chips(){
  var cats=["Tous"]; PRODUCTS.forEach(function(p){if(cats.indexOf(p.cat)<0)cats.push(p.cat)});
  $("chips").innerHTML = cats.map(function(c){return '<button class="chip'+(c===cat?' on':'')+'" data-c="'+esc(c)+'">'+esc(c)+'</button>'}).join("");
}
function find(id){for(var i=0;i<PRODUCTS.length;i++)if(PRODUCTS[i].id==id)return PRODUCTS[i]}
function sl(p){return p.cat==="Chaussures"?"Pointure":"Taille"}
function render(){
  var t=$("q").value.toLowerCase().trim();
  var list=PRODUCTS.filter(function(p){return (cat==="Tous"||p.cat===cat)&&(p.name.toLowerCase().indexOf(t)>-1||p.cat.toLowerCase().indexOf(t)>-1)});
  $("empty").hidden = list.length>0;
  $("grid").innerHTML = list.map(function(p){
    var ph = p.img ? '<img src="'+p.img+'" alt="'+esc(p.name)+'">' : p.emoji;
    var sel = p.sizes ? '<select class="sel" id="s'+p.id+'"><option value="">'+(p.cat==="Chaussures"?"Choisir la pointure":"Choisir la taille")+'</option>'+p.sizes.map(function(s){return '<option>'+s+'</option>'}).join("")+'</select>' : '';
    return '<div class="p"><div class="ph">'+ph+'</div><div class="pb"><div class="pn">'+esc(p.name)+'</div><div class="pp">'+usd(p.price)+'</div><div class="dl">'+(p.ship?'+ livraison '+fc(p.ship):'Livraison incluse')+'</div>'+sel+'<button class="btn" data-a="'+p.id+'">Ajouter</button></div></div>';
  }).join("");
}
function count(){var n=0;for(var k in cart)n+=cart[k].q;$("cnt").textContent=n;return n}
function totals(){var s=0,d=0;for(var k in cart){var it=cart[k],p=find(it.id);s+=p.price*it.q;d+=p.ship*it.q}return {s:s,d:d}}
function drawCart(){
  var h="";
  for(var k in cart){var it=cart[k],p=find(it.id);
    h+='<div class="row"><div><div class="pn">'+esc(p.name)+(it.size?' — '+sl(p)+' '+esc(it.size):'')+'</div><div class="note">'+usd(p.price)+'</div></div><div class="q"><button data-m="'+esc(k)+'">−</button> <b>'+it.q+'</b> <button data-p="'+esc(k)+'">+</button></div></div>'}
  $("items").innerHTML = h || '<div class="empty">Votre panier est vide.</div>';
  var t=totals();
  $("sum").innerHTML = h ? '<div><span>Articles</span><span>'+usd(t.s)+'</span></div><div><span>Livraison</span><span>'+(t.d?fc(t.d):'Incluse')+'</span></div><div class="t"><span>À payer à la livraison</span><span>'+usd(t.s)+(t.d?' + '+fc(t.d):'')+'</span></div>' : '';
  $("form").style.display = h ? "block" : "none";
  count();
}
$("chips").onclick=function(e){var c=e.target.getAttribute("data-c");if(c){cat=c;chips();render()}};
$("q").oninput=render;
$("grid").onclick=function(e){
  var a=e.target.getAttribute("data-a");if(!a)return;
  var p=find(a),size="";
  if(p.sizes){var s=$("s"+p.id);size=s?s.value:"";if(!size){alert("Merci de choisir la "+sl(p).toLowerCase()+" avant d’ajouter.");if(s)s.focus();return}}
  var k=a+"|"+size;
  if(cart[k])cart[k].q++;else cart[k]={id:p.id,size:size,q:1};
  count();e.target.textContent="Ajouté ✓";setTimeout(function(){e.target.textContent="Ajouter"},800)};
$("items").onclick=function(e){var p=e.target.getAttribute("data-p"),m=e.target.getAttribute("data-m");
  if(p)cart[p].q++; if(m){cart[m].q--;if(cart[m].q<=0)delete cart[m]} drawCart()};
$("open").onclick=function(){drawCart();$("m").classList.add("open")};
$("close").onclick=function(){$("m").classList.remove("open")};
$("send").onclick=function(){
  var nom=$("nom").value.trim(),tel=$("tel").value.trim(),adr=$("adr").value.trim();
  if(!nom||!tel||!adr){alert("Merci de remplir votre nom, votre numéro et votre adresse.");return}
  var t=totals(),l=["🛍️ *Nouvelle commande — "+SHOP_NAME+"*",""];
